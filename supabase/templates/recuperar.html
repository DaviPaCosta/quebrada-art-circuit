<!-- Assunto: Crie uma nova senha — Vozes do Muro -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1a1a1a;">
  <h1 style="font-size: 24px; margin: 0 0 16px;">Nova senha</h1>
  <p style="font-size: 16px; line-height: 1.5;">
    Recebemos um pedido para trocar a senha da sua conta no Vozes do Muro. Toque no botão para criar uma nova.
  </p>
  <p style="margin: 28px 0;">
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
       style="background: #f97316; color: #111; padding: 14px 24px; border-radius: 8px; font-weight: bold; text-decoration: none; display: inline-block;">
      Criar nova senha
    </a>
  </p>
  <p style="font-size: 13px; color: #666;">Se não foi você, ignore este e-mail. Sua senha continua a mesma.</p>
</div>
